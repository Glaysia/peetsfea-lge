kind = "tv"
primitive = "box"
present = true
non_model = true
material = "vacuum"
plane = "YZ"
origin_xyz = [0.0, -921.0, 340.0]
size_xyz = [9.0, 1842.0, 1055.0]
transparency = 0.6

[[non_model_objects]]
id = "tx_region"
kind = "tx_region"
primitive = "box"
present = true
non_model = true
material = "vacuum"
plane = "XY"
origin_xyz = [0.0, -921.0, 0.0]
size_xyz = [480.0, 1842.0, 290.0]
transparency = 0.2

[[non_model_objects]]
id = "tx_region_max"
kind = "tx_region_max"
