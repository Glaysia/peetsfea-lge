# 0.3.9.0 SSW sampled authoring input.
# ----------------------------------------------------------------------------
# 이 파일은 0.3.9.0 SSW coil sweep의 SSOT다.
# TX/RX 각각의 sampled coil 변수, fixed compatibility 변수,
# shared layout 변수와 shared ferrite 변수를 포함하며,
# 자유변수 기준 총 18차원이다.
#
# Range 형식:
# - [true, start, end, count]는 integer 후보 range다.
# - [false, start, end, count]는 float 후보 range다.
# - fixed TOML에서는 같은 public field를 [*, value, value, 1]로 freeze한다.

spec_version = "0.3.9.0"
schema_id = "peetsfea.ssw_coil.step.v1"
runtime_compatible = false

[design]
units = "mm"

[backend]
authoring_tool = "cadquery"
solver_tool = "hfss"
interchange_format = "step"

# ----------------------------------------------------------------------------
# Fixed geometry dimensions
# ----------------------------------------------------------------------------

[fixed_dimensions.fr4_thickness_mm]
range = [false, 0.24, 0.24, 1]
description = "FR4 thickness(mm)"

[fixed_dimensions.copper_thickness_mm]
range = [false, 0.07, 0.07, 1]
description = "Copper thickness(mm)"

[fixed_dimensions.port_length_mm]
range = [false, 2.0, 2.0, 1]
description = "Port landing gap length(mm)"

[fixed_dimensions.port_landing_pad_mm]
range = [false, 5.5, 5.5, 1]
description = "SSW/AEDT nominal port landing pad width(mm); normal/spiral pad follows realized trace width"

[fixed_dimensions.port_landing_drop_mm]
range = [false, 0.24, 0.24, 1]
description = "Port landing drop distance(mm)"

[fixed_dimensions.port_landing_overlap_mm]
range = [false, 0.01, 0.01, 1]
description = "Port landing overlap(mm)"

[fixed_dimensions.width_max_mm]
range = [false, 1080.0, 1080.0, 1]
description = "Maximum coil width(mm)"

[fixed_dimensions.height_max_mm]
range = [false, 180.0, 180.0, 1]
description = "Maximum coil height(mm)"

[fixed_dimensions.tx_rx_min_distance_mm]
range = [false, 50.0, 200.0, 100]
description = "Minimum edge-to-edge distance between TX and RX coils(mm)"

[fixed_dimensions.mull_ferrite_thickness_mm]
range = [false, 0.12, 0.12, 1]
description = "MULL ferrite sheet thickness(mm)"

# ----------------------------------------------------------------------------
# MULL ferrite sheet placement
# ----------------------------------------------------------------------------

[ferrite.tx_mull_is_enabled]
range = [true, 1, 1, 1]
description = "TX MULL ferrite sheet enable flag"

[ferrite.tx_mull_position_ratio]
range = [false, 0.0, 0.9, 24]
description = "TX MULL ferrite Z position ratio: 0 tx_region_max bottom, 1 TX coil-adjacent"

[ferrite.tx_mull_sheet_count]
range = [true, 1, 5, 5]
description = "TX MULL ferrite sheet count, stacked downward with a one-thickness gap between sheets"

[ferrite.rx_mull_is_enabled]
range = [true, 0, 0, 1]
description = "RX MULL ferrite sheet enable flag"

[ferrite.rx_mull_position_ratio]
range = [false, 0.0, 1.0, 11]
description = "RX MULL ferrite X position ratio: 0 rx_region_max X-min, 1 RX coil-adjacent"

# ----------------------------------------------------------------------------
# Non-model object registry
# ----------------------------------------------------------------------------

[[non_model_objects]]
