[project]
name = "peetsfea"
version = "0.3.9.5"
description = "Minimal STEP-based two-port HFSS baseline."
readme = "README.md"
requires-python = "==3.12.12"
license = { text = "MIT" }
dependencies = [
]

[project.optional-dependencies]
all = [
  "build123d>=0.10.0",
  "cadquery>=2.5",
  "ocp-vscode>=3.1.2",
  "pyaedt[graphics]==0.25.1",
  "psutil",
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peetsfea"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "entry"]
exclude = ["ref", "**/__pycache__"]
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
markers = [
  "contract: pure-Python acceptance/contract tests for default CI",
  "pyaedt_integration: real headless AEDT/PyAEDT integration tests required for AEDT-affecting changes",
]
