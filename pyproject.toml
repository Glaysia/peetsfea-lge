[project]
name = "peetsfea-lge"
# PEP 440 equivalent of the requested release label "lge-0.1.0".
version = "0.1.0+lge"
description = "Minimal STEP-based two-port HFSS baseline."
readme = "README.md"
requires-python = "==3.14.4"
license = { text = "MIT" }
dependencies = [
  "build123d>=0.10.0",
  "ocp-vscode>=3.1.2",
]

[project.scripts]
dev = "peetsfea.lgevdd_dev:main"

[project.optional-dependencies]
all = [
  "cadquery>=2.5",
  "pyaedt[graphics]==1.3.0",
  "psutil",
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peetsfea"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "entry"]
exclude = ["ref", "**/__pycache__"]
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
markers = [
  "contract: pure-Python acceptance/contract tests for default CI",
  "pyaedt_integration: real headless AEDT/PyAEDT integration tests required for AEDT-affecting changes",
]
